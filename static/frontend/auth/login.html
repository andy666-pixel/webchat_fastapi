<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login • User</title>
  <style>
    /* here is going to be the css that is going to implement chatgpt btw */
  </style>
</head>
<body>
  <main class="card" role="main">
    <header>
      <div class="logo">U</div>
      <div>
        <h1>Iniciar sesión</h1>
        <p>Los datos se enviarán al endpoint <code>/users/token</code></p>
      </div>
    </header>

    <form id="loginForm">
      <div class="field">
        <label for="username">Nombre de usuario</label>
        <input id="username" name="username" type="text" placeholder="tu_usuario" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <div class="actions">
        <button type="submit">Entrar</button>
      </div>
    </form>

    <pre id="result" style="white-space: pre-wrap; margin-top: 20px;"></pre>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        alert("Porfa ingresa tu usuario y contraseña");
        return;
      }

      const data = new URLSearchParams();
      data.append("username", username);
      data.append("password", password);

      try {
        // Paso 1: Ora hacemos una request al endpoint del endpoint con los datos proporcionados en el formulario
        const tokenResponse = await fetch("/users/token", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "Accept": "application/json"
          },
          body: data.toString()
        });

        if (!tokenResponse.ok) {
          const errorData = await tokenResponse.json();
          throw new Error(errorData.detail || "Error al obtener el token");
        }

        const tokenResult = await tokenResponse.json();
        const accessToken = tokenResult.access_token;

        // Paso 2: Usar token ese mismo token para iniciar sesion con la instancia del usuario
        const userResponse = await fetch("/users/home/me", {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + accessToken,
            "Accept": "application/json"
          }
        });

        if (!userResponse.ok) {
          const errorUser = await userResponse.json();
          throw new Error(errorUser.detail || "No pudimos obtener los datos del usuario");
        }

        const userData = await userResponse.json();
         
        document.getElementById("result").textContent = "Login exitoso!\n\nUsuario:\n" + JSON.stringify(userData, null, 2);    
        localStorage.setItem("userdata",  JSON.stringify(userData));
        localStorage.setItem("accestoken", accessToken)
        window.location.href = "/static/frontend/chat/index.html";

      } catch (error) {
        console.error("Error en login:", error);
        alert("Error en login: " + error.message);
      }
    });
  </script>
</body>
</html>
