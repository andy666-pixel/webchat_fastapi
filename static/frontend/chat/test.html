<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App</title>
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <main>
    <!-- Join form -->
    <section class="join-section">
      <form id="joinForm">
        <input type="text" id="name" placeholder="Your name" required />
        <input type="text" id="room" placeholder="Chat room" required />
        <button type="submit">Join</button>
      </form>
    </section>

    <!-- Chat area -->
    <section class="chat-section hidden">
      <ul id="messages"></ul>
      <form id="form-msg">
        <input type="text" id="messageText" placeholder="Type a message..." required />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script>
    // ID único de cliente
    var client_id = Date.now();

    // Inicializa WebSocket apuntando a tu endpoint FastAPI
    var ws = new WebSocket(`ws://localhost:8000/ws/${client_id}`);

    // Cuando llega un mensaje del servidor
    ws.onmessage = function(event) {
      var messages = document.getElementById('messages');
      var message = document.createElement('li');
      message.textContent = event.data;  // tu backend envía f"{data}" o broadcast
      messages.appendChild(message);
    };

    // Función para enviar mensaje
    function sendMessage(event) {
      event.preventDefault();  // evita que el form haga GET
      var input = document.getElementById("messageText");
      if(input.value.trim() !== "") {
        ws.send(input.value); // envía mensaje al backend
        input.value = "";
      }
    }

    // Conectar formulario al submit
    document.getElementById("form-msg").addEventListener("submit", sendMessage);
  </script>
</body>
</html>
