<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App</title>
  <link href="style.css" rel="stylesheet"/>
</head>
<body>
  <main>
    <!-- Chat area -->
    <section class="chat-section hidden">
      <div id="Username"></div>
      <ul id="messages"></ul>
      <form id="form-msg">
        <input type="text" id="messageText" placeholder="Type a message..." required />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
<!-- //----------------------------------------Script for global chat-----------------------------------------------------------------// -->
<script>
  //---------------------------------------------------------------------------------------------------------//
  // First retrieve the users data from localstorage and its accesstoken
  const accessToken = localStorage.getItem("accesstoken");
  const userDataStr = localStorage.getItem("userdata");
  //---------------------------------------------------------------------------------------------------------//
  
  let username = null;
  
  //---------------------------------------------------------------------------------------------------------//
  // Those if <if (example) {}> its going to be used many times in all the application,
  // They mean that if (example) contains a value or is not null, execute the if and it does whatever what that code needs to do.
  if (userDataStr) {  
    const userdata = JSON.parse(userDataStr);
    username = userdata.name;                               
    document.getElementById("Username").textContent = username;
    // Si la variable username no es null se inicia la conexion websocket
    if (username) {
      var ws = new WebSocket(`ws://localhost:8000/chat/ws/${username}`);
      ws.onmessage = function(event) {
        var messages = document.getElementById('messages');
        var message = document.createElement('li'); 
        message.textContent = event.data;
        messages.appendChild(message);
      };
  
      document.getElementById("form-msg").addEventListener("submit", function(event){
        event.preventDefault();
        const content = document.getElementById("messageText").value;
        const sender_name = document.getElementById("Username").textContent;     
        const message_data = {
          content: content,
          sender_name: sender_name,
        };
        const message_data_json = JSON.stringify(message_data);
        ws.send(message_data_json);
        document.getElementById("messageText").value = '';
      });
    }
  } else {
    console.log("acceso no autorizado manin");
    window.location.href = "unauthorized.html"; 
  }
  </script>
  
<!-- //----------------------------------------Script for global chat-----------------------------------------------------------------// -->
 
</body>
</html>
